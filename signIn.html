<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/img/logo/favicon.svg" />
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/login.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>
    <title>판다마켓</title>
  </head>
  <body>
    <div class="wrap login-wrapper">
      <a href="/" class="login-logo">
       <img src="/img/logo/logo.svg" alt="판다마켓_로고" />
     </a><!--로고_판다마켓 --></a>
     <form>
      <div class="box">
        <label for="email">이메일</label>
        <input type="email" name="email" id="email" placeholder="이메일을 입력해주세요" required />
        <span class="email-error error-text">잘못된 이메일 형식입니다.</span>
      </div>

      <div class="box">
        <label for="nickName">닉네임</label>
        <input type="text" name="nickName" id="nickName" placeholder="닉네임을 입력해주세요" required />
      </div>

      <div class="box">
        <label for="password">비밀번호</label>
        <div class="pw-box">
         <input type="password" name="password" id="password" placeholder="비밀번호를 입력해주세요" required />
         <div id="eyes" class="eyes"><i class="eyes-icon"></i></div>
        </div>
        <span class="password-error error-text">비밀번호를 8자 이상 입력해주세요</span>
      </div>

      <div class="box">
        <label for="password_check">비밀번호 확인</label>
        <div class="pw-box pw_check">
         <input type="password" name="password_check" id="password_check" placeholder="비밀번호를 다시 한 번 입력해주세요" required />
         <div id="eyes-check" class="eyes"><i class="eyes-icon"></i></div>
        </div>
        <span class="password-check-error error-text">비밀번호가 일치하지 않습니다.</span>
      </div>
       <button id="singin-btn" type="button" disabled>회원가입</button>
     </form>
 
     <div class="sns-login">
       <p>간편 로그인하기</p>
       <ul>
         <li>
          <a href="https://www.google.com/" target="_blank">
            <img src="/img/login/google.svg" alt="구글_로그인">
          </a>
        </li>
         <li>
          <a href="https://www.kakaocorp.com/page/" target="_blank">
            <img src="/img/login/kakao.svg" alt="카카오_로그인">
          </a>
        </li>
       </ul>
     </div>
     
     <div class="singup">
       이미 회원이신가요?
       <a href="/login.html">로그인</a>
     </div>
    </div>
    <script type="module" src="./js/login.js"></script>
  </body>
</html>
